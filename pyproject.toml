[project]
name = "mg-zs-rag"
version = "0.1.0"
description = "MG ZS car manual RAG assistant powered by NVIDIA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-nvidia-ai-endpoints",
    "unstructured",
    "python-dotenv",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/mg_zs_rag']

[tool.ruff]
# 忽略 F401(未使用的导入错误/清理)，这样 Ruff 排序时就不会删掉未使用的库了
lint.ignore = ["F401"]

[tool.ruff.lint.isort]
# 如果你想自定义 isort(导入排序)的行为也可以写在这里